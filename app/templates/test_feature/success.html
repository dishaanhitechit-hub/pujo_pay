<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Confirmed</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    background: linear-gradient(135deg, #020c1b, #041630, #061d40);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: 'JetBrains Mono', monospace;
    color: #f0f8ff;
  }

  .card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .icon {
    width: 72px;
    height: 72px;
    background: rgba(16,185,129,0.2);
    border: 2px solid rgba(16,185,129,0.5);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 24px;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    color: #6ee7b7;
    margin-bottom: 10px;
  }

  .sub {
    font-size: 14px;
    color: rgba(255,255,255,0.55);
    margin-bottom: 30px;
    line-height: 1.6;
  }

  .info-box {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 20px;
    text-align: left;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    font-size: 14px;
  }
  .info-row:last-child { border-bottom: none; }

  .info-label {
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    flex-shrink: 0;
  }

  .info-value {
    color: #e2e8f0;
    font-weight: 600;
    text-align: right;
  }

  .session-note {
    margin-top: 24px;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon">&#10003;</div>
  <h1>Attendance Recorded!</h1>
  <p class="sub">Your presence has been successfully registered for today.</p>

  <div class="info-box">
    <div class="info-row">
      <span class="info-label">Name</span>
      <span class="info-value">{{ record.name }}</span>
    </div>
    <div class="info-row">
      <span class="info-label">Phone</span>
      <span class="info-value">{{ record.phone }}</span>
    </div>
    {% if record.address %}
    <div class="info-row">
      <span class="info-label">Address</span>
      <span class="info-value">{{ record.address }}</span>
    </div>
    {% endif %}
    <div class="info-row">
      <span class="info-label">Time</span>
      <span class="info-value">{{ record.created_at | to_ist }}</span>
    </div>
  </div>

  <p class="session-note">Session #{{ session.session_number }} &nbsp;&middot;&nbsp; {{ session.date }}</p>
</div>

</body>
</html>
