<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PujoPay — Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f0f4ff; min-height: 100vh; padding: 24px 16px; }
  nav { display: flex; justify-content: space-between; align-items: center;
        background: #fff; border-radius: 12px; padding: 14px 20px; margin-bottom: 24px;
        box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  nav h2 { font-size: 16px; color: #4361ee; }
  .nav-right { display: flex; gap: 10px; align-items: center; }
  .nav-right span { font-size: 13px; color: #888; }
  .btn-nav { padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
  .btn-dash { background: #e8f0fe; color: #4361ee; }
  .btn-out  { background: #ffebee; color: #c62828; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; max-width: 1100px; margin-left: auto; margin-right: auto; }
  @media(max-width:800px) { .stats-grid { grid-template-columns: repeat(2,1fr); } }
  @media(max-width:480px) { .stats-grid { grid-template-columns: 1fr; } }
  .stat { background: #fff; border-radius: 14px; padding: 20px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .stat .label { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .stat .value { font-size: 28px; font-weight: 800; color: #1a1a2e; }
  .stat .sub   { font-size: 12px; color: #888; margin-top: 4px; }
  .stat.blue .value { color: #4361ee; }
  .stat.green .value { color: #2d9d5a; }
  .stat.amber .value { color: #d68910; }
  .stat.red .value   { color: #c0392b; }

  .section { background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.07);
             padding: 22px; max-width: 1100px; margin: 0 auto 22px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .section-head h2 { font-size: 15px; color: #1a1a2e; }
  .btn-sm { padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700;
            cursor: pointer; border: none; background: #eee; color: #333; }
  .btn-sm:hover { background: #ddd; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; background: #f8f9ff; color: #666;
       font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #f5f5f5; color: #333; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .overflow { overflow-x: auto; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; }
  .badge-cash      { background: #e8f5e9; color: #2e7d32; }
  .badge-upi       { background: #e8eaf6; color: #283593; }
  .badge-confirmed  { background: #e8f5e9; color: #2e7d32; }
  .badge-pending    { background: #fff8e1; color: #f57f17; }
  .badge-expired    { background: #ffebee; color: #c62828; }
  .badge-cancelled  { background: #f3e5f5; color: #6a1b9a; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .filters input, .filters select { padding: 7px 11px; border: 1.5px solid #e0e0e0; border-radius: 8px;
                                     font-size: 13px; outline: none; background: #fff; }
  .filters input:focus, .filters select:focus { border-color: #4361ee; }
  .btn-filter { padding: 7px 16px; border-radius: 8px; background: #4361ee; color: #fff;
                font-size: 13px; font-weight: 700; border: none; cursor: pointer; }
  .pagination { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; align-items: center; }
  .pagination span { font-size: 13px; color: #666; }
  .page-btn { padding: 5px 12px; border-radius: 6px; border: 1.5px solid #e0e0e0;
              background: #fff; font-size: 13px; cursor: pointer; }
  .page-btn:disabled { opacity: .4; cursor: default; }
  .page-btn.active { background: #4361ee; color: #fff; border-color: #4361ee; }

  .empty { text-align: center; color: #bbb; padding: 28px; font-size: 13px; }
</style>
</head>
<body>

<nav>
  <h2>🪔 PujoPay — Dashboard</h2>
  <div class="nav-right">
    <span id="navUser"></span>
    <button class="btn-nav btn-dash" onclick="goto('collect.html')">Collect</button>
    <button class="btn-nav btn-dash" onclick="goto('token.html')">Token</button>
    <button class="btn-nav btn-dash" onclick="goto('admin.html')">Admin</button>
    <button class="btn-nav btn-out"  onclick="logout()">Logout</button>
  </div>
</nav>

<!-- ── Grand Summary ── -->
<div class="stats-grid" id="statsGrid">
  <div class="stat blue"><div class="label">Total Collected</div><div class="value" id="totalAmt">—</div><div class="sub">confirmed</div></div>
  <div class="stat green"><div class="label">Cash</div><div class="value" id="cashAmt">—</div><div class="sub" id="cashCount">—</div></div>
  <div class="stat amber"><div class="label">UPI</div><div class="value" id="upiAmt">—</div><div class="sub" id="upiCount">—</div></div>
  <div class="stat"><div class="label">Payments</div><div class="value" id="totalPayments">—</div><div class="sub" id="pendingCount">— pending</div></div>
</div>

<!-- ── Collector Breakdown ── -->
<div class="section">
  <div class="section-head">
    <h2>👤 Collector Breakdown</h2>
    <button class="btn-sm" onclick="loadCollectors()">↻ Refresh</button>
  </div>
  <div class="overflow">
    <table>
      <thead><tr>
        <th>Collector</th><th>Role</th><th>Total (₹)</th><th>Cash (₹)</th><th>UPI (₹)</th><th>Payments</th>
      </tr></thead>
      <tbody id="collectorsBody">
        <tr><td colspan="6" class="empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ── All Payments ── -->
<div class="section">
  <div class="section-head">
    <h2>📋 All Payments</h2>
    <button class="btn-sm" onclick="loadPayments(1)">↻ Refresh</button>
  </div>

  <div class="filters">
    <select id="f_collector">
      <option value="">All collectors</option>
    </select>
    <select id="f_method">
      <option value="">All methods</option>
      <option value="cash">Cash</option>
      <option value="upi">UPI</option>
    </select>
    <select id="f_status">
      <option value="">All statuses</option>
      <option value="confirmed">Confirmed</option>
      <option value="pending">Pending</option>
      <option value="expired">Expired</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <input type="date" id="f_from" title="Filter by date">
    <button class="btn-filter" onclick="loadPayments(1)">Search</button>
  </div>

  <div class="overflow">
    <table>
      <thead><tr>
        <th>#</th><th>Receipt No</th><th>Donor</th><th>Amount (₹)</th><th>Method</th><th>Status</th><th>Collector</th><th>Date</th><th>UTR</th>
      </tr></thead>
      <tbody id="paymentsBody">
        <tr><td colspan="9" class="empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <button class="page-btn" id="prevBtn" onclick="loadPayments(currentPage-1)">← Prev</button>
    <span id="pageInfo">Page 1</span>
    <button class="page-btn" id="nextBtn" onclick="loadPayments(currentPage+1)">Next →</button>
  </div>
</div>

<script>
  const BASE = "http://132.154.156.82:5999";
  const token = localStorage.getItem("token");
  if (!token) window.location.href = "login.html";

  const user = JSON.parse(localStorage.getItem("user") || "{}");
  document.getElementById("navUser").textContent = user.name || "";

  let currentPage = 1;
  let totalPages  = 1;

  function authH() { return { "Content-Type": "application/json", "Authorization": "Bearer " + token }; }

  function fmt(n) {
    if (n === undefined || n === null) return "—";
    return "₹" + Number(n).toLocaleString("en-IN", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  async function loadSummary() {
    const res = await fetch(`${BASE}/api/dashboard/summary`, { headers: authH() }).catch(() => null);
    if (!res || !res.ok) return;
    const d = (await res.json()).data;
    document.getElementById("totalAmt").textContent      = fmt(d.grandTotal);
    document.getElementById("cashAmt").textContent       = fmt(d.cashTotal);
    document.getElementById("cashCount").textContent     = (d.confirmedCount || 0) + " confirmed";
    document.getElementById("upiAmt").textContent        = fmt(d.upiTotal);
    document.getElementById("upiCount").textContent      = (d.totalDonors || 0) + " donors";
    document.getElementById("totalPayments").textContent = d.confirmedCount || 0;
    document.getElementById("pendingCount").textContent  = (d.pendingCount || 0) + " pending";
  }

  async function loadCollectors() {
    document.getElementById("collectorsBody").innerHTML =
      '<tr><td colspan="6" class="empty">Loading...</td></tr>';
    const res = await fetch(`${BASE}/api/dashboard/collectors`, { headers: authH() }).catch(() => null);
    if (!res || !res.ok) {
      document.getElementById("collectorsBody").innerHTML =
        '<tr><td colspan="6" class="empty" style="color:#c62828">Failed to load</td></tr>';
      return;
    }
    const collectors = (await res.json()).data;

    // populate filter dropdown
    const sel = document.getElementById("f_collector");
    sel.innerHTML = '<option value="">All collectors</option>';
    collectors.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c.collector.id;
      opt.textContent = c.collector.name;
      sel.appendChild(opt);
    });
    if (!collectors.length) {
      document.getElementById("collectorsBody").innerHTML =
        '<tr><td colspan="6" class="empty">No data yet</td></tr>';
      return;
    }
    document.getElementById("collectorsBody").innerHTML = collectors.map(c => `
      <tr>
        <td><strong>${c.collector.name}</strong></td>
        <td style="color:#888;font-size:12px">${c.collector.role}</td>
        <td><strong>${fmt(c.grandTotal)}</strong></td>
        <td>${fmt(c.cashTotal)}</td>
        <td>${fmt(c.upiTotal)}</td>
        <td>${c.confirmedCount || 0}</td>
      </tr>`).join("");
  }

  async function loadPayments(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    document.getElementById("paymentsBody").innerHTML =
      '<tr><td colspan="9" class="empty">Loading...</td></tr>';

    const params = new URLSearchParams({ page, perPage: 15 });
    const collectorId = document.getElementById("f_collector").value;
    const method      = document.getElementById("f_method").value;
    const status      = document.getElementById("f_status").value;
    const date        = document.getElementById("f_from").value;
    if (collectorId) params.set("collectorId", collectorId);
    if (method)      params.set("method", method);
    if (status)      params.set("status", status);
    if (date)        params.set("date", date);

    const res = await fetch(`${BASE}/api/dashboard/payments?${params}`, { headers: authH() }).catch(() => null);
    if (!res || !res.ok) {
      document.getElementById("paymentsBody").innerHTML =
        '<tr><td colspan="9" class="empty" style="color:#c62828">Failed to load</td></tr>';
      return;
    }
    const json = await res.json();
    const payments = json.data.payments || [];
    totalPages = json.data.pages || 1;

    document.getElementById("pageInfo").textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById("prevBtn").disabled = currentPage <= 1;
    document.getElementById("nextBtn").disabled = currentPage >= totalPages;

    if (!payments.length) {
      document.getElementById("paymentsBody").innerHTML =
        '<tr><td colspan="9" class="empty">No payments found</td></tr>';
      return;
    }
    document.getElementById("paymentsBody").innerHTML = payments.map((p, i) => {
      const donor = p.donor || {};
      const collector = p.collector || {};
      return `
      <tr>
        <td style="color:#aaa">${(currentPage - 1) * 15 + i + 1}</td>
        <td style="font-family:monospace;font-size:12px">${p.receiptNo || '—'}</td>
        <td><strong>${donor.name || '—'}</strong>${donor.phone ? `<br><span style="color:#aaa;font-size:11px">${donor.phone}</span>` : ''}</td>
        <td><strong>₹${Number(p.amount).toLocaleString("en-IN")}</strong></td>
        <td><span class="badge badge-${p.method}">${p.method.toUpperCase()}</span></td>
        <td><span class="badge badge-${p.status}">${p.status}</span></td>
        <td>${collector.name || '—'}</td>
        <td style="font-size:12px;white-space:nowrap">${p.createdAt ? new Date(p.createdAt).toLocaleString("en-IN", {dateStyle:"short",timeStyle:"short"}) : '—'}</td>
        <td style="font-family:monospace;font-size:11px;color:#666">${p.utrNumber || '—'}</td>
      </tr>`;
    }).join("");
  }

  function logout() { localStorage.clear(); window.location.href = "login.html"; }
  function goto(p)  { window.location.href = p; }

  const isExecutive = user.role === "executive";

  if (isExecutive) {
    // Hide collector breakdown and collector filter — executive sees only their own data
    document.querySelector(".section:nth-of-type(1)").style.display = "none";
    document.getElementById("f_collector").style.display = "none";
    // Rewire search button to executive loader
    document.querySelector(".btn-filter").onclick = () => loadExecutivePayments(1);

    loadExecutiveSummary();
    loadExecutivePayments(1);
  } else {
    loadSummary();
    loadCollectors();
    loadPayments(1);
  }

  async function loadExecutiveSummary() {
    const res = await fetch(`${BASE}/api/collector/summary`, { headers: authH() }).catch(() => null);
    if (!res || !res.ok) return;
    const d = (await res.json()).data;
    document.getElementById("totalAmt").textContent      = fmt(d.grandTotal);
    document.getElementById("cashAmt").textContent       = fmt(d.cashTotal);
    document.getElementById("cashCount").textContent     = (d.confirmedCount || 0) + " confirmed";
    document.getElementById("upiAmt").textContent        = fmt(d.upiTotal);
    document.getElementById("upiCount").textContent      = "my collections";
    document.getElementById("totalPayments").textContent = d.confirmedCount || 0;
    document.getElementById("pendingCount").textContent  = (d.pendingCount || 0) + " pending";
  }

  async function loadExecutivePayments(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    document.getElementById("paymentsBody").innerHTML =
      '<tr><td colspan="9" class="empty">Loading...</td></tr>';

    const params = new URLSearchParams({ page, perPage: 15 });
    const method = document.getElementById("f_method").value;
    const status = document.getElementById("f_status").value;
    const date   = document.getElementById("f_from").value;
    if (method) params.set("method", method);
    if (status) params.set("status", status);
    if (date)   params.set("date", date);

    const res = await fetch(`${BASE}/api/collector/payments?${params}`, { headers: authH() }).catch(() => null);
    if (!res || !res.ok) {
      document.getElementById("paymentsBody").innerHTML =
        '<tr><td colspan="9" class="empty" style="color:#c62828">Failed to load</td></tr>';
      return;
    }
    const json = await res.json();
    const payments = json.data.payments || [];
    totalPages = json.data.pages || 1;

    document.getElementById("pageInfo").textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById("prevBtn").disabled = currentPage <= 1;
    document.getElementById("nextBtn").disabled = currentPage >= totalPages;
    document.getElementById("prevBtn").onclick = () => loadExecutivePayments(currentPage - 1);
    document.getElementById("nextBtn").onclick = () => loadExecutivePayments(currentPage + 1);

    if (!payments.length) {
      document.getElementById("paymentsBody").innerHTML =
        '<tr><td colspan="9" class="empty">No payments found</td></tr>';
      return;
    }
    document.getElementById("paymentsBody").innerHTML = payments.map((p, i) => {
      const donor = p.donor || {};
      const collector = p.collector || {};
      return `
      <tr>
        <td style="color:#aaa">${(currentPage - 1) * 15 + i + 1}</td>
        <td style="font-family:monospace;font-size:12px">${p.receiptNo || '—'}</td>
        <td><strong>${donor.name || '—'}</strong>${donor.phone ? `<br><span style="color:#aaa;font-size:11px">${donor.phone}</span>` : ''}</td>
        <td><strong>₹${Number(p.amount).toLocaleString("en-IN")}</strong></td>
        <td><span class="badge badge-${p.method}">${p.method.toUpperCase()}</span></td>
        <td><span class="badge badge-${p.status}">${p.status}</span></td>
        <td>${collector.name || '—'}</td>
        <td style="font-size:12px;white-space:nowrap">${p.createdAt ? new Date(p.createdAt).toLocaleString("en-IN", {dateStyle:"short",timeStyle:"short"}) : '—'}</td>
        <td style="font-family:monospace;font-size:11px;color:#666">${p.utrNumber || '—'}</td>
      </tr>`;
    }).join("");
  }
</script>
</body>
</html>
