<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PujoPay — Collect Payment</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f0f4ff; min-height: 100vh; padding: 24px 16px; }
  nav { display: flex; justify-content: space-between; align-items: center;
        background: #fff; border-radius: 12px; padding: 14px 20px; margin-bottom: 24px;
        box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  nav h2 { font-size: 16px; color: #4361ee; }
  nav span { font-size: 13px; color: #888; }
  .nav-right { display: flex; gap: 10px; align-items: center; }
  .btn-nav { padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
             cursor: pointer; border: none; }
  .btn-dash { background: #e8f0fe; color: #4361ee; }
  .btn-out  { background: #ffebee; color: #c62828; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
          padding: 32px 28px; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; color: #1a1a2e; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 28px; }
  .section-title { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase;
                   letter-spacing: .6px; margin-bottom: 12px; margin-top: 20px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 5px; }
  input, textarea, select { width: 100%; padding: 10px 14px; border: 1.5px solid #e0e0e0;
    border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 14px;
    transition: border .2s; font-family: inherit; }
  input:focus, textarea:focus, select:focus { border-color: #4361ee; }
  textarea { resize: vertical; min-height: 60px; }
  .required { color: #e03131; }
  .method-row { display: flex; gap: 12px; margin-bottom: 14px; }
  .method-btn { flex: 1; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px;
                font-size: 14px; font-weight: 600; cursor: pointer; background: #fff;
                transition: all .2s; text-align: center; }
  .method-btn.active-cash { border-color: #2d9d5a; background: #e8f5e9; color: #2d9d5a; }
  .method-btn.active-upi  { border-color: #4361ee; background: #e8f0fe; color: #4361ee; }
  .btn-submit { width: 100%; padding: 14px; background: #4361ee; color: #fff; border: none;
                border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer;
                margin-top: 8px; transition: opacity .2s; }
  .btn-submit:hover { opacity: .88; }
  .btn-submit:disabled { background: #aaa; cursor: not-allowed; }
  .msg { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 13px;
         font-weight: 600; display: none; }
  .err { background: #ffebee; color: #c62828; }
  .ok  { background: #e8f5e9; color: #2e7d32; }
</style>
</head>
<body>

<nav>
  <h2>🪔 PujoPay</h2>
  <div class="nav-right">
    <span id="navUser"></span>
    <button class="btn-nav btn-dash" onclick="goto('dashboard.html')">Dashboard</button>
    <button class="btn-nav btn-dash" onclick="goto('token.html')">Token</button>
    <button class="btn-nav btn-out" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="card">
  <h1>Collect Payment</h1>
  <p class="sub">Fill donor details and initiate payment</p>

  <div class="section-title">Donor Info</div>

  <label>Name <span class="required">*</span></label>
  <input type="text" id="donor_name" placeholder="e.g. Suresh Mondal">

  <label>Phone</label>
  <input type="tel" id="donor_phone" placeholder="e.g. 9800000001">

  <label>Address</label>
  <input type="text" id="donor_address" placeholder="e.g. 12 Lake Road, Kolkata">

  <label>Notes</label>
  <textarea id="donor_notes" placeholder="Any notes (optional)"></textarea>

  <div class="section-title">Payment</div>

  <label>Amount (₹) <span class="required">*</span></label>
  <input type="number" id="amount" placeholder="e.g. 500" min="1" step="0.01">

  <label>Payment Method <span class="required">*</span></label>
  <div class="method-row">
    <button class="method-btn" id="btnCash" onclick="selectMethod('cash')">💵 Cash</button>
    <button class="method-btn" id="btnUpi"  onclick="selectMethod('upi')">📱 UPI / QR</button>
  </div>

  <button class="btn-submit" id="submitBtn" onclick="initiate()">Initiate Payment →</button>

  <div class="msg err" id="errMsg"></div>
  <div class="msg ok"  id="okMsg"></div>
</div>

<script>
  const BASE = "http://132.154.156.82:5999";
  let selectedMethod = null;

  const token = localStorage.getItem("token");
  if (!token) window.location.href = "login.html";

  const user = JSON.parse(localStorage.getItem("user") || "{}");
  document.getElementById("navUser").textContent = user.name || "";
  if (user.role === "admin") window.location.href = "dashboard.html";

  function selectMethod(m) {
    selectedMethod = m;
    document.getElementById("btnCash").className = "method-btn" + (m === "cash" ? " active-cash" : "");
    document.getElementById("btnUpi").className  = "method-btn" + (m === "upi"  ? " active-upi"  : "");
  }

  async function initiate() {
    hide();
    const donor_name = document.getElementById("donor_name").value.trim();
    const amount     = document.getElementById("amount").value.trim();

    if (!donor_name) return showErr("Donor name is required");
    if (!amount || parseFloat(amount) <= 0) return showErr("Enter a valid amount");
    if (!selectedMethod) return showErr("Select a payment method");

    document.getElementById("submitBtn").disabled = true;
    document.getElementById("submitBtn").textContent = "Processing...";

    const body = {
      donorName:    donor_name,
      donorPhone:   document.getElementById("donor_phone").value.trim() || null,
      donorAddress: document.getElementById("donor_address").value.trim() || null,
      donorNotes:   document.getElementById("donor_notes").value.trim() || null,
      amount,
      method: selectedMethod,
    };

    const res = await fetch(`${BASE}/api/payment/initiate`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(body),
    }).catch(() => null);

    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "Initiate Payment →";

    if (!res) return showErr("Cannot reach server");
    const json = await res.json();
    if (!res.ok) return showErr(json.message || "Failed");

    showOk(`Payment initiated! Redirecting to ${selectedMethod.toUpperCase()} page...`);
    setTimeout(() => {
      window.location.href = BASE + json.data.nextUrl;
    }, 700);
  }

  function logout() { localStorage.clear(); window.location.href = "login.html"; }
  function goto(p)   { window.location.href = p; }
  function showErr(msg) { const el = document.getElementById("errMsg"); el.textContent = msg; el.style.display = "block"; }
  function showOk(msg)  { const el = document.getElementById("okMsg");  el.textContent = msg; el.style.display = "block"; }
  function hide() {
    document.getElementById("errMsg").style.display = "none";
    document.getElementById("okMsg").style.display  = "none";
  }
</script>
</body>
</html>
